name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-branch:
    name: Enforce Branch Rules
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Prevent direct push to main
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')
        run: |
          echo "❌ Direct pushes to main are not allowed"
          echo "Please create a pull request instead"
          exit 1
      - name: Require approval
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull request mode: CI checks will verify"
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler ripgrep
      - name: Check deterministic simulation invariants
        run: bash .github/scripts/check-sim-invariants.sh
      - name: Check Raft core stays synchronous
        run: bash .github/scripts/check-raft-invariants.sh
      - name: Check KV state machine determinism
        run: bash .github/scripts/check-kv-invariants.sh
      - run: cargo test --all-targets --verbose
      - name: Deterministic replay stress test
        run: cargo test --lib sim::tests::same_seed_is_deterministic_for_one_thousand_seeds -- --ignored
      - name: Clean-build golden trace check
        run: |
          cargo clean
          cargo test --lib sim::tests::canonical_trace_matches_golden_fixture

  acceptance:
    name: 1000-seed Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: Election and replicate acceptance (issues #9, #10)
        run: >
          cargo test --release --lib -- --ignored
          elects_exactly_one_leader_within_600_ticks_for_1000_seeds
          replicate_100_writes_identical_logs_for_1000_seeds

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - run: cargo build --all --verbose
      - run: cargo build --bins --release --verbose
