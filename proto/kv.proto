syntax = "proto3";

package kv;

service Kv {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc Cas(CasRequest) returns (CasResponse);
}

// Carried in the details of a FAILED_PRECONDITION status. `leader_hint` is the
// leader's KV address ("host:port"), or empty while no leader is known.
message NotLeader {
    string leader_hint = 1;
}

message ClientMeta {
    uint64 client_id = 1;
    uint64 seq_num = 2;
}

message GetRequest {
    ClientMeta meta = 1;
    bytes key = 2;
}

message GetResponse {
    optional bytes value = 1;
    optional uint64 version = 2;
}

message PutRequest {
    ClientMeta meta = 1;
    bytes key = 2;
    bytes value = 3;
}

message PutResponse {
    optional bytes previous = 1;
    uint64 version = 2;
}

message DeleteRequest {
    ClientMeta meta = 1;
    bytes key = 2;
}

message DeleteResponse {
    optional bytes previous = 1;
}

message CasRequest {
    ClientMeta meta = 1;
    bytes key = 2;
    optional uint64 expected_version = 3;
    optional bytes value = 4;
}

message CasResponse {
    bool applied = 1;
    optional bytes previous = 2;
    optional uint64 version = 3;
    optional uint64 actual_version = 4;
    optional bytes actual_value = 5;
}
