syntax = "proto3";

package raft;

//triggered by election when a follower's election timeout fired. Tries
//to promote itself into a candidate

//Sender: Candidate
//Receiver: every other node in cluster
//Collect votes to become the leader, need majority
message RequestVoteRequest{
    uint64 term            =1; //candidate's current term
    uint64 candidate_id    =2; //who is requesting vote
    uint64 last_log_index  =3; //candidate's last log entry index
    uint64 last_log_term   =4; //candidate;s last log entry term
}
//receiver uses last log index and last log term for log freshness check
//receiver grants the vote if candidate's log is at least as up-to-date as receiver's


message RequestVoteResponse {
    uint64 term =1;
    bool vote_granted =2;
}

message LogEntry {
    uint64 term =1;
    uint64 index = 2;
    bytes command = 3;
}

//Used in replication and heartbeat
//Sender: leader
//Receiver: every follower
//Purpose(replication): replicate new log entries, advance follower commit index
//Purpose(heartbeat): assert leadership, reset follower's election timers, entries field empty
message AppendEntriesRequest {
    uint64 term            =1; //leader's current term
    uint64 leader_id       =2;  //used for follower to redirect clients
    uint64 prev_log_index  =3;  //consistency check anchor
    uint64 prev_log_term   =4;  //consistency check anchor
    repeated LogEntry entries =5;   //empty = heartbeat, populate = log replication
    uint64 leader_commit   =6;      //leader's current commit index'
}

//receiver rejects success = false if leader term < receiver's term indicating stale leader
//no entry at prev_log_index with matching prev_log_term, conflict log divergence
//on rejection from divergence, leader decrements nextIndex[follower] and retries with an earlier anchor.
//Walks back until consistency checks passes, then replays forward from that point
message AppendEntriesResponse {
    uint64 term =1;
    bool success =2;
    //last log index the responder actually acknowledged (0 on rejection).
    //the leader sets matchIndex/nextIndex from this instead of guessing, so a
    //rejection costs one round trip rather than a decrement-and-retry walk
    uint64 match_index =3;
}

//when a follower is so far behind that the leader no longer has the log entries need to catch it up
//they've been compacted into a snapshot

//sender: leader
//receiver: lagging follower by id
//log compact old committed entries into a snapshot. Point-in-time dump of the entire state machine and
//discard the old log entries. Snapshot is sent to lagging follower to catch it up. Snapshot is also used for new nodes joining the cluster

// InstallSnapshot is chunked by `offset`. Duplicate/reordered chunks are rejected by the follower.
message InstallSnapshotRequest {
    uint64 term =1;
    uint64 leader_id =2;
    uint64 last_included_index =3;
    uint64 last_included_term =4;
    uint64 offset =5;
    bytes data =6;
    bool done =7;
}

message InstallSnapshotResponse {
    uint64 term =1;
}

//One envelope for every Raft message, request and response alike.
//
//The consensus core never blocks waiting for a reply: it emits a response as
//just another outbound message, and a reply re-enters the receiver as an
//ordinary input. So a response has to be *sendable*, which a unary return value
//is not. Mapping all six onto one fire-and-forget method is what lets the
//simulator and the running node drive the core through the identical sequence
//of inputs, rather than one of them turning replies inside out.
//
//`from` is on the envelope because the receiver needs the sender's node id to
//route a reply, and a TCP peer address is not a Raft identity.
message RaftMessage {
    uint64 from =1;
    oneof payload {
        RequestVoteRequest request_vote =2;
        RequestVoteResponse request_vote_response =3;
        AppendEntriesRequest append_entries =4;
        AppendEntriesResponse append_entries_response =5;
        InstallSnapshotRequest install_snapshot =6;
        InstallSnapshotResponse install_snapshot_response =7;
    }
}

//Deliberately empty. Accepting a message says nothing about having handled it;
//the answer, when there is one, arrives as its own RaftMessage.
message Ack {}

service RaftService {
    rpc Deliver(RaftMessage) returns (Ack);
}
