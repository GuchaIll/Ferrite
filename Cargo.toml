[package]
name = "ferrite"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bincode = "1"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
proptest = "1"

[build-dependencies]
tonic-build = "0.11"
